<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img"><title>Compile time and run time</title><desc>The net for y[i] = x[i] * (2 + 3). At compile time the + rule turns 2 + 3 into 5 and a duplicator copies it to four multiplies; the multiplies wait for x. At run time the inputs 7, 1, 4 and 2 arrive and the four multiplies fire at once on four cores, giving 35, 5, 20 and 10.</desc><style>
:root{--bg:#FFFFFF;--card:#F5F5F7;--ink:#1D1D1F;--ink3:#86868B;--hair:rgba(0,0,0,.20);
--accent:#3D6FB6;--alt:#B4531A;--good:#2E7D46;--c1:#B4531A;--c2:#2E7D46;--c3:#8E44AD;--c4:#3D6FB6}
@media (prefers-color-scheme: dark){:root{--bg:#0B0B0D;--card:#141417;--ink:#ECEAE4;--ink3:#A6A6B0;
--hair:rgba(255,255,255,.22);--accent:#7FB0FF;--alt:#F5641E;--good:#4FBF72;--c1:#F5641E;--c2:#4FBF72;--c3:#C39BFF;--c4:#7FB0FF}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.agent{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.value{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
.aux{stroke:var(--ink3);stroke-width:1.4;fill:none}
.active{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}
.lbl{font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.small{font-size:12px;fill:var(--ink3)}
.glow{fill:none;stroke-width:3;rx:12}
@keyframes bc{0.00%{opacity:1} 48.00%{opacity:1} 52.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes br{0.00%{opacity:0} 52.00%{opacity:0} 57.00%{opacity:1} 94.00%{opacity:1} 99.00%{opacity:0} 100.00%{opacity:0}}@keyframes dup{0.00%{opacity:1} 32.00%{opacity:1} 37.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes plus{0.00%{opacity:1} 16.00%{opacity:1} 21.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes gplus{0.00%{opacity:0} 8.50%{opacity:0} 10.00%{opacity:1} 16.00%{opacity:1} 19.00%{opacity:0} 100.00%{opacity:0}}@keyframes five{0.00%{opacity:0} 16.00%{opacity:0} 21.00%{opacity:1} 32.00%{opacity:1} 37.00%{opacity:0} 100.00%{opacity:0}}@keyframes gdup{0.00%{opacity:0} 24.50%{opacity:0} 26.00%{opacity:1} 32.00%{opacity:1} 35.00%{opacity:0} 100.00%{opacity:0}}@keyframes dlbl{0.00%{opacity:0} 24.50%{opacity:0} 26.00%{opacity:1} 34.00%{opacity:1} 37.00%{opacity:0} 100.00%{opacity:0}}@keyframes mul0{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes c0{0.00%{opacity:0} 32.00%{opacity:0} 37.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 100.00%{opacity:0}}@keyframes slot0{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes in0{0.00%{opacity:0} 52.00%{opacity:0} 56.00%{opacity:1} 66.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes gm0{0.00%{opacity:0} 58.50%{opacity:0} 60.00%{opacity:1} 67.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes o0{0.00%{opacity:0} 67.00%{opacity:0} 72.00%{opacity:1} 94.00%{opacity:1} 99.00%{opacity:0} 100.00%{opacity:0}}@keyframes mul1{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes c1{0.00%{opacity:0} 32.00%{opacity:0} 37.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 100.00%{opacity:0}}@keyframes slot1{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes in1{0.00%{opacity:0} 52.00%{opacity:0} 56.00%{opacity:1} 66.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes gm1{0.00%{opacity:0} 58.50%{opacity:0} 60.00%{opacity:1} 67.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes o1{0.00%{opacity:0} 67.00%{opacity:0} 72.00%{opacity:1} 94.00%{opacity:1} 99.00%{opacity:0} 100.00%{opacity:0}}@keyframes mul2{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes c2{0.00%{opacity:0} 32.00%{opacity:0} 37.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 100.00%{opacity:0}}@keyframes slot2{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes in2{0.00%{opacity:0} 52.00%{opacity:0} 56.00%{opacity:1} 66.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes gm2{0.00%{opacity:0} 58.50%{opacity:0} 60.00%{opacity:1} 67.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes o2{0.00%{opacity:0} 67.00%{opacity:0} 72.00%{opacity:1} 94.00%{opacity:1} 99.00%{opacity:0} 100.00%{opacity:0}}@keyframes mul3{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes c3{0.00%{opacity:0} 32.00%{opacity:0} 37.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 100.00%{opacity:0}}@keyframes slot3{0.00%{opacity:1} 66.00%{opacity:1} 71.00%{opacity:0} 95.00%{opacity:0} 100.00%{opacity:1}}@keyframes in3{0.00%{opacity:0} 52.00%{opacity:0} 56.00%{opacity:1} 66.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes gm3{0.00%{opacity:0} 58.50%{opacity:0} 60.00%{opacity:1} 67.00%{opacity:1} 70.00%{opacity:0} 100.00%{opacity:0}}@keyframes o3{0.00%{opacity:0} 67.00%{opacity:0} 72.00%{opacity:1} 94.00%{opacity:1} 99.00%{opacity:0} 100.00%{opacity:0}}@keyframes res{0.00%{opacity:0} 38.00%{opacity:0} 43.00%{opacity:1} 89.00%{opacity:1} 94.00%{opacity:0} 100.00%{opacity:0}}@keyframes done{0.00%{opacity:0} 72.00%{opacity:0} 77.00%{opacity:1} 90.00%{opacity:1} 95.00%{opacity:0} 100.00%{opacity:0}}</style><rect width="960" height="490" rx="16" fill="var(--bg)"/><g style="animation:bc 10.0s linear infinite" ><text x="480" y="34" class="lbl" style="font-size:17px"><tspan style="fill:var(--accent)">Compile time</tspan>: rules fire wherever the inputs are written in the source</text></g><g style="animation:br 10.0s linear infinite" ><text x="480" y="34" class="lbl" style="font-size:17px"><tspan style="fill:var(--alt)">Run time</tspan>: the same rules fire on the pairs that waited for the input</text></g><text x="480" y="58" class="lbl small mono" style="font-size:13px">y[i] = x[i] × (2 + 3)   for i in 0..3</text><g style="animation:dup 10.0s linear infinite" ><line class="aux" x1="480" y1="216" x2="180" y2="278"/><line class="aux" x1="480" y1="216" x2="380" y2="278"/><line class="aux" x1="480" y1="216" x2="580" y2="278"/><line class="aux" x1="480" y1="216" x2="780" y2="278"/><line class="active" x1="480" y1="112" x2="480" y2="190"/><rect class="agent" x="457.0" y="185.0" width="46" height="30" rx="8"/><text class="lbl mono" x="480" y="200">δ</text></g><g style="animation:plus 10.0s linear infinite" ><line class="active" x1="480" y1="104" x2="480" y2="144"/><line class="aux" x1="460" y1="96" x2="420" y2="124"/><rect class="agent" x="457.0" y="81.0" width="46" height="30" rx="8"/><text class="lbl mono" x="480" y="96">+</text><circle class="value" cx="480" cy="152" r="17"/><text class="lbl mono" x="480" y="152" style="font-size:15px">2</text><circle class="value" cx="412" cy="128" r="14"/><text class="lbl mono" x="412" y="128" style="font-size:15px">3</text></g><g style="animation:gplus 10.0s linear infinite" ><rect class="glow" x="392" y="74" width="122" height="102" rx="12" style="stroke:var(--accent)"/></g><g style="animation:five 10.0s linear infinite" ><circle class="value" cx="480" cy="96" r="17"/><text class="lbl mono" x="480" y="96" style="font-size:15px">5</text></g><g style="animation:gdup 10.0s linear infinite" ><rect class="glow" x="440" y="70" width="80" height="150" rx="12" style="stroke:var(--accent)"/></g><g style="animation:dlbl 10.0s linear infinite" ><text x="560" y="150" class="small">δ copies the 5</text></g><g style="animation:mul0 10.0s linear infinite" ><line class="active" x1="180" y1="315" x2="180" y2="368"/><rect class="agent" x="157.0" y="285.0" width="46" height="30" rx="8"/><text class="lbl mono" x="180" y="300">×</text></g><g style="animation:c0 10.0s linear infinite" ><line class="aux" x1="157" y1="300" x2="142" y2="300"/><circle class="value" cx="128" cy="300" r="13"/><text class="lbl mono" x="128" y="300" style="font-size:15px">5</text></g><g style="animation:slot0 10.0s linear infinite" ><rect x="158" y="368" width="44" height="30" rx="7" fill="none" stroke="var(--ink3)" stroke-dasharray="4 3"/><text x="180" y="414" class="lbl small mono">x[0]</text></g><g style="animation:in0 10.0s linear infinite" ><text x="180" y="383" class="lbl mono" style="fill:var(--c1)">7</text></g><g style="animation:gm0 10.0s linear infinite" ><rect class="glow" x="144" y="276" width="72" height="132" rx="12" style="stroke:var(--c1)"/><text x="180" y="436" class="lbl" style="font-size:12px;fill:var(--c1)">core 1</text></g><g style="animation:o0 10.0s linear infinite" ><circle class="value" cx="180" cy="300" r="21" style="stroke:var(--c1)"/><text class="lbl mono" x="180" y="300" style="font-size:15px">35</text><text x="180" y="340" class="lbl small mono">y[0]</text></g><g style="animation:mul1 10.0s linear infinite" ><line class="active" x1="380" y1="315" x2="380" y2="368"/><rect class="agent" x="357.0" y="285.0" width="46" height="30" rx="8"/><text class="lbl mono" x="380" y="300">×</text></g><g style="animation:c1 10.0s linear infinite" ><line class="aux" x1="357" y1="300" x2="342" y2="300"/><circle class="value" cx="328" cy="300" r="13"/><text class="lbl mono" x="328" y="300" style="font-size:15px">5</text></g><g style="animation:slot1 10.0s linear infinite" ><rect x="358" y="368" width="44" height="30" rx="7" fill="none" stroke="var(--ink3)" stroke-dasharray="4 3"/><text x="380" y="414" class="lbl small mono">x[1]</text></g><g style="animation:in1 10.0s linear infinite" ><text x="380" y="383" class="lbl mono" style="fill:var(--c2)">1</text></g><g style="animation:gm1 10.0s linear infinite" ><rect class="glow" x="344" y="276" width="72" height="132" rx="12" style="stroke:var(--c2)"/><text x="380" y="436" class="lbl" style="font-size:12px;fill:var(--c2)">core 2</text></g><g style="animation:o1 10.0s linear infinite" ><circle class="value" cx="380" cy="300" r="21" style="stroke:var(--c2)"/><text class="lbl mono" x="380" y="300" style="font-size:15px">5</text><text x="380" y="340" class="lbl small mono">y[1]</text></g><g style="animation:mul2 10.0s linear infinite" ><line class="active" x1="580" y1="315" x2="580" y2="368"/><rect class="agent" x="557.0" y="285.0" width="46" height="30" rx="8"/><text class="lbl mono" x="580" y="300">×</text></g><g style="animation:c2 10.0s linear infinite" ><line class="aux" x1="557" y1="300" x2="542" y2="300"/><circle class="value" cx="528" cy="300" r="13"/><text class="lbl mono" x="528" y="300" style="font-size:15px">5</text></g><g style="animation:slot2 10.0s linear infinite" ><rect x="558" y="368" width="44" height="30" rx="7" fill="none" stroke="var(--ink3)" stroke-dasharray="4 3"/><text x="580" y="414" class="lbl small mono">x[2]</text></g><g style="animation:in2 10.0s linear infinite" ><text x="580" y="383" class="lbl mono" style="fill:var(--c3)">4</text></g><g style="animation:gm2 10.0s linear infinite" ><rect class="glow" x="544" y="276" width="72" height="132" rx="12" style="stroke:var(--c3)"/><text x="580" y="436" class="lbl" style="font-size:12px;fill:var(--c3)">core 3</text></g><g style="animation:o2 10.0s linear infinite" ><circle class="value" cx="580" cy="300" r="21" style="stroke:var(--c3)"/><text class="lbl mono" x="580" y="300" style="font-size:15px">20</text><text x="580" y="340" class="lbl small mono">y[2]</text></g><g style="animation:mul3 10.0s linear infinite" ><line class="active" x1="780" y1="315" x2="780" y2="368"/><rect class="agent" x="757.0" y="285.0" width="46" height="30" rx="8"/><text class="lbl mono" x="780" y="300">×</text></g><g style="animation:c3 10.0s linear infinite" ><line class="aux" x1="757" y1="300" x2="742" y2="300"/><circle class="value" cx="728" cy="300" r="13"/><text class="lbl mono" x="728" y="300" style="font-size:15px">5</text></g><g style="animation:slot3 10.0s linear infinite" ><rect x="758" y="368" width="44" height="30" rx="7" fill="none" stroke="var(--ink3)" stroke-dasharray="4 3"/><text x="780" y="414" class="lbl small mono">x[3]</text></g><g style="animation:in3 10.0s linear infinite" ><text x="780" y="383" class="lbl mono" style="fill:var(--c4)">2</text></g><g style="animation:gm3 10.0s linear infinite" ><rect class="glow" x="744" y="276" width="72" height="132" rx="12" style="stroke:var(--c4)"/><text x="780" y="436" class="lbl" style="font-size:12px;fill:var(--c4)">core 4</text></g><g style="animation:o3 10.0s linear infinite" ><circle class="value" cx="780" cy="300" r="21" style="stroke:var(--c4)"/><text class="lbl mono" x="780" y="300" style="font-size:15px">10</text><text x="780" y="340" class="lbl small mono">y[3]</text></g><g style="animation:res 10.0s linear infinite" ><rect x="120" y="262" width="720" height="166" rx="16" fill="none" stroke="var(--alt)" stroke-dasharray="6 5"/><text x="130" y="254" class="small" style="fill:var(--alt)">left for run time: the pairs that need x, compiled to native code</text></g><g style="animation:done 10.0s linear infinite" ><text x="480" y="466" class="lbl" style="font-size:14px;fill:var(--good)">✓ four rewrites at once, one per core: the answer does not depend on which core runs which</text></g></svg>
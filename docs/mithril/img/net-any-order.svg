imation:w3 10.0s linear infinite" ><line class="aux" x1="795" y1="128" x2="725" y2="182"/><line class="aux" x1="795" y1="128" x2="865" y2="182"/></g><g style="animation:p3a 10.0s linear infinite" ><line class="active" x1="725" y1="205" x2="725" y2="255"/><line class="aux" x1="707" y1="196" x2="680" y2="228"/><rect class="agent" x="702.0" y="181.0" width="46" height="30" rx="8"/><text class="lbl mono" x="725" y="196">+</text><circle class="value" cx="725" cy="262" r="17"/><text class="lbl mono" x="725" y="262" style="font-size:15px">2</text><circle class="value" cx="680" cy="236" r="14"/><text class="lbl mono" x="680" y="236" style="font-size:15px">3</text></g><g style="animation:g3a 10.0s linear infinite" ><rect class="glow" x="687" y="172" width="76" height="112" rx="12" style="stroke:var(--accent)"/><text x="725" y="300" class="lbl" style="font-size:12px;fill:var(--accent)">rule 1</text></g><g style="animation:r3a 10.0s linear infinite" ><circle class="value" cx="725" cy="196" r="17"/><text class="lbl mono" x="725" y="196" style="font-size:15px">5</text></g><g style="animation:p3b 10.0s linear infinite" ><line class="active" x1="865" y1="205" x2="865" y2="255"/><line class="aux" x1="847" y1="196" x2="910" y2="228"/><rect class="agent" x="842.0" y="181.0" width="46" height="30" rx="8"/><text class="lbl mono" x="865" y="196">+</text><circle class="value" cx="865" cy="262" r="17"/><text class="lbl mono" x="865" y="262" style="font-size:15px">4</text><circle class="value" cx="910" cy="236" r="14"/><text class="lbl mono" x="910" y="236" style="font-size:15px">5</text></g><g style="animation:g3b 10.0s linear infinite" ><rect class="glow" x="835" y="172" width="88" height="112" rx="12" style="stroke:var(--accent)"/><text x="865" y="300" class="lbl" style="font-size:12px;fill:var(--accent)">rule 1</text></g><g style="animation:r3b 10.0s linear infinite" ><circle class="value" cx="865" cy="196" r="17"/><text class="lbl mono" x="865" y="196" style="font-size:15px">9</text><
e</text><rect x="20" y="52" width="290" height="300" rx="14" fill="var(--card)" stroke="var(--hair)"/><text x="165" y="80" class="lbl" style="font-size:15px">first left, then right</text><g style="animation:w1 10.0s linear infinite" ><line class="aux" x1="165" y1="128" x2="95" y2="182"/><line class="aux" x1="165" y1="128" x2="235" y2="182"/></g><g style="animation:p1a 10.0s linear infinite" ><line class="active" x1="95" y1="205" x2="95" y2="255"/><line class="aux" x1="77" y1="196" x2="50" y2="228"/><rect class="agent" x="72.0" y="181.0" width="46" height="30" rx="8"/><text class="lbl mono" x="95" y="196">+</text><circle class="value" cx="95" cy="262" r="17"/><text class="lbl mono" x="95" y="262" style="font-size:15px">2</text><circle class="value" cx="50" cy="236" r="14"/><text class="lbl mono" x="50" y="236" style="font-size:15px">3</text></g><g style="animation:g1a 10.0s linear infinite" ><rect class="glow" x="57" y="172" width="76" height="112" rx="12" style="stroke:var(--accent)"/><text x="95" y="300" class="lbl" style="font-size:12px;fill:var(--accent)">rule 1</text></g><g style="animation:r1a 10.0s linear infinite" ><circle class="value" cx="95" cy="196" r="17"/><text class="lbl mono" x="95" y="196" style="font-size:15px">5</text></g><g style="animation:p1b 10.0s linear infinite" ><line class="active" x1="235" y1="205" x2="235" y2="255"/><line class="aux" x1="217" y1="196" x2="280" y2="228"/><rect class="agent" x="212.0" y="181.0" width="46" height="30" rx="8"/><text class="lbl mono" x="235" y="196">+</text><circle class="value" cx="235" cy="262" r="17"/><text class="lbl mono" x="235" y="262" style="font-size:15px">4</text><circle class="value" cx="280" cy="236" r="14"/><text class="lbl mono" x="280" y="236" style="font-size:15px">5</text></g><g style="animation:g1b 10.0s linear infinite" ><rect class="glow" x="205" y="172" width="88" height="112" rx="12" style="stroke:var(--accent)"/><text x="235" y="300" class="lbl" style="font-size:12px;fill:var(--accent)">